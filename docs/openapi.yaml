
openapi: 3.0.3

info:
  title: Harambee Hub API
  version: 0.2.0
  description: |
    REST API for the Harambee Hub fundraising platform.

    Supports registration, email verification, JWT authentication,
    campaign management, pledges and administration.

    Protected endpoints require:
    Authorization: Bearer <token>

    Access tokens expire after one hour.

servers:
  - url: https://harambee-hub-backend.onrender.com
    description: Production API

tags:
  - name: Health
  - name: Auth
  - name: Campaigns
  - name: Pledges
  - name: Admin

paths:

  /api/health:
    get:
      tags: [Health]
      summary: Check API and database health
      responses:
        "200":
          description: API and database are healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  database:
                    type: string
                    example: ok
        "503":
          description: Database is unreachable

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Only organizers and contributors can self-register. An email verification link is sent after registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
              properties:
                name:
                  type: string
                  maxLength: 100
                  example: Amina Otieno
                email:
                  type: string
                  format: email
                  example: amina@example.com
                password:
                  type: string
                  minLength: 8
                  example: secret123
                phone:
                  type: string
                  nullable: true
                  maxLength: 20
                  example: "0712345678"
                role:
                  type: string
                  enum:
                    - organizer
                    - contributor
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  email_sent:
                    type: boolean
                  user:
                    $ref: "#/components/schemas/User"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Registration validation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegistrationValidationError"
        "500":
          description: Registration failed

  /api/auth/verify-email/{token}:
    get:
      tags: [Auth]
      summary: Verify a user's email address
      description: Verification links expire after one hour.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified successfully or already verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Verification link is invalid or expired
        "404":
          description: User not found
        "500":
          description: Email verification failed

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in
      description: Returns a JWT access token. Unverified users cannot log in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: amina@example.com
                password:
                  type: string
                  example: secret123
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid email or password
        "403":
          description: Email address has not been verified
        "422":
          description: Login validation failed

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the currently authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Missing, invalid or expired token
        "404":
          description: User not found

  /api/auth/change-password:
    post:
      tags: [Auth]
      summary: Change the authenticated user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - old_password
                - new_password
              properties:
                old_password:
                  type: string
                new_password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: New password must be at least 8 characters
        "401":
          description: Incorrect old password or missing/invalid token
        "404":
          description: User not found

  /api/campaigns/:
    get:
      tags: [Campaigns]
      summary: List campaigns
      description: Returns campaigns ordered by creation date, newest first.
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated campaign list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCampaigns"
        "422":
          description: Invalid pagination parameters

    post:
      tags: [Campaigns]
      summary: Create a campaign
      description: Organizer only. Accepts JSON or multipart form data with an optional image.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignInput"
          multipart/form-data:
            schema:
              type: object
              required:
                - title
                - description
                - goal_amount
              properties:
                title:
                  type: string
                  minLength: 3
                  maxLength: 150
                description:
                  type: string
                  minLength: 10
                goal_amount:
                  type: number
                  minimum: 0.01
                end_date:
                  type: string
                  format: date-time
                  nullable: true
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          description: Invalid request body or campaign data
        "401":
          description: Authentication required
        "403":
          description: Organizer role required
        "422":
          description: Invalid campaign pagination or data
        "502":
          description: Image upload failed

  /api/campaigns/{campaign_id}:
    get:
      tags: [Campaigns]
      summary: Get a campaign by ID
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "404":
          description: Campaign not found

  /api/pledges/campaign/{campaign_id}:
    get:
      tags: [Pledges]
      summary: List public pledges for a campaign
      description: Cancelled pledges are not publicly displayed. Anonymous contributor identities are hidden.
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated campaign pledges
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignPledgeList"
        "404":
          description: Campaign not found
        "422":
          description: Invalid query parameters

    post:
      tags: [Pledges]
      summary: Create a pledge for a campaign
      description: Authenticated contributors only. The campaign must be active.
      security:
        - bearerAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PledgeInput"
      responses:
        "201":
          description: Pledge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge:
                    $ref: "#/components/schemas/Pledge"
        "401":
          description: Authentication required
        "403":
          description: Contributor role required
        "404":
          description: Campaign not found
        "409":
          description: Campaign is closed
        "422":
          description: Invalid pledge data

  /api/pledges/mine:
    get:
      tags: [Pledges]
      summary: Get the authenticated user's pledges
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated pledges belonging to the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyPledgeList"
        "401":
          description: Authentication required
        "422":
          description: Invalid query parameters

  /api/pledges/campaign/{campaign_id}/manage:
    get:
      tags: [Pledges]
      summary: Manage pledges for a campaign
      description: Available to the campaign organizer or an administrator.
      security:
        - bearerAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated campaign pledges and status counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedPledgeList"
        "401":
          description: Authentication required
        "403":
          description: Campaign organizer or admin access required
        "404":
          description: Campaign not found
        "422":
          description: Invalid query parameters

  /api/pledges/{pledge_id}:
    get:
      tags: [Pledges]
      summary: Get a pledge by ID
      description: Accessible to the contributor, campaign organizer or an admin.
      security:
        - bearerAuth: []
      parameters:
        - name: pledge_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pledge details
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge:
                    $ref: "#/components/schemas/Pledge"
        "401":
          description: Authentication required
        "403":
          description: Access denied
        "404":
          description: Pledge not found

    patch:
      tags: [Pledges]
      summary: Update a pending pledge
      description: Only the contributor who created the pending pledge can edit it.
      security:
        - bearerAuth: []
      parameters:
        - name: pledge_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PledgeUpdateInput"
      responses:
        "200":
          description: Pledge updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge:
                    $ref: "#/components/schemas/Pledge"
        "401":
          description: Authentication required
        "403":
          description: Access denied
        "404":
          description: Pledge not found
        "409":
          description: Only pending pledges can be edited
        "422":
          description: Invalid pledge data

    delete:
      tags: [Pledges]
      summary: Cancel a pending pledge
      description: Available to the pledge owner or an admin. Only pending pledges can be cancelled.
      security:
        - bearerAuth: []
      parameters:
        - name: pledge_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pledge cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge:
                    $ref: "#/components/schemas/Pledge"
        "401":
          description: Authentication required
        "403":
          description: Access denied
        "404":
          description: Pledge not found
        "409":
          description: Only pending pledges can be cancelled

  /api/pledges/{pledge_id}/confirm:
    post:
      tags: [Pledges]
      summary: Confirm a pledge
      description: Available to the campaign organizer or an administrator. Only pending pledges can be confirmed.
      security:
        - bearerAuth: []
      parameters:
        - name: pledge_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pledge confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmPledgeResponse"
        "401":
          description: Authentication required
        "403":
          description: Access denied
        "404":
          description: Pledge not found
        "409":
          description: Only pending pledges can be confirmed

  /api/pledges/{pledge_id}/remind:
    post:
      tags: [Pledges]
      summary: Send a pledge reminder
      description: Available to the organizer of the campaign associated with the pledge.
      security:
        - bearerAuth: []
      parameters:
        - name: pledge_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reminder sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Contributor email is unavailable
        "401":
          description: Authentication required
        "403":
          description: Access denied
        "404":
          description: Pledge not found
        "502":
          description: Failed to send pledge reminder
        "503":
          description: Email or campaign service unavailable

  /api/admin/users:
    get:
      tags: [Admin]
      summary: List registered users
      description: Administrators only.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedUsers"
        "401":
          description: Authentication required
        "403":
          description: Admin role required
        "422":
          description: Invalid pagination parameters

  /api/admin/dashboard:
    get:
      tags: [Admin]
      summary: Get administrator dashboard statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Authentication required
        "403":
          description: Admin role required

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      description: Page number, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1

    PerPage:
      name: per_page
      in: query
      description: Number of records per page. Maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  schemas:

    Error:
      type: object
      properties:
        error:
          type: string
          example: Not found
        details:
          type: object
          additionalProperties: true

    RegistrationValidationError:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        role:
          type: string
          enum: [organizer, contributor, admin]
        email_verified:
          type: boolean

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT access token. Expires after one hour.
        user:
          $ref: "#/components/schemas/User"

    CampaignInput:
      type: object
      required:
        - title
        - description
        - goal_amount
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
          example: Help Amina Pay School Fees
        description:
          type: string
          minLength: 10
          example: A fundraising campaign to support school fees.
        goal_amount:
          type: string
          description: Decimal amount, with up to two decimal places.
          example: "50000.00"
        end_date:
          type: string
          format: date-time
          nullable: true

    Campaign:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        goal_amount:
          type: string
          example: "50000.00"
        image_url:
          type: string
          nullable: true
        status:
          type: string
          example: active
        end_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        organizer_id:
          type: integer

    PaginatedCampaigns:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    PledgeInput:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          minimum: 1
          maximum: 10000000
          example: 1000
        message:
          type: string
          nullable: true
          maxLength: 500
        is_anonymous:
          type: boolean
          default: false

    PledgeUpdateInput:
      type: object
      description: Provide at least one of amount or message.
      minProperties: 1
      properties:
        amount:
          type: number
          minimum: 1
          maximum: 10000000
        message:
          type: string
          nullable: true
          maxLength: 500

    Pledge:
      type: object
      properties:
        id:
          type: integer
        campaign_id:
          type: integer
        amount:
          type: number
        message:
          type: string
          nullable: true
        is_anonymous:
          type: boolean
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        contributor:
          nullable: true
          oneOf:
            - $ref: "#/components/schemas/ContributorSummary"
            - type: "null"

    ContributorSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true

    CampaignPledgeList:
      type: object
      properties:
        campaign_id:
          type: integer
        raised_amount:
          type: number
        count:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Pledge"

    MyPledgeList:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Pledge"

    ManagedPledgeList:
      type: object
      properties:
        campaign_id:
          type: integer
        raised_amount:
          type: number
        counts:
          type: object
          properties:
            pending:
              type: integer
            confirmed:
              type: integer
            cancelled:
              type: integer
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/Pledge"

    ConfirmPledgeResponse:
      type: object
      properties:
        pledge:
          $ref: "#/components/schemas/Pledge"
        campaign_id:
          type: integer
        raised_amount:
          type: number

    PaginatedUsers:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    AdminDashboard:
      type: object
      properties:
        users_by_role:
          type: object
          additionalProperties:
            type: integer
        campaigns_by_status:
          type: object
          additionalProperties:
            type: integer
        total_pledged:
          type: string
          example: "25000.00"
        total_confirmed:
          type: string
          example: "15000.00"
        pledges_by_status:
          type: object
          additionalProperties:
            type: integer
