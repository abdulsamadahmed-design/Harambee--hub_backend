openapi: 3.0.3

servers:
  - url: https://harambee-hub-backend.onrender.com
    description: Production API
  - url: http://localhost:5000
    description: Local development server

info:
  title: Harambee Hub API
  version: 1.0.0
  description: |
    API documentation for the implemented Harambee Hub backend.

    Backend roles:
    - organizer: manages their own campaigns and has platform-management access.
    - contributor: creates and manages their own pledges.

    The /api/admin URL prefix contains organizer-only platform-management
    endpoints. There is no separate admin role.

paths:
  /api/health:
    get:
      summary: Check API and database health
      security: []
      responses:
        '200':
          description: API and database are reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: ok }
        '503':
          description: Database is unreachable

  /api/auth/register:
    post:
      summary: Register a user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  email_sent: { type: boolean }
                  user: { $ref: '#/components/schemas/User' }
        '409':
          description: Email already registered
        '422':
          description: Registration validation failed
        '500':
          description: Registration failed

  /api/auth/verify-email/{token}:
    get:
      summary: Verify a user's email address
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          description: Verification token expires after one hour.
      responses:
        '200':
          description: Email verified or already verified
        '400':
          description: Invalid or expired verification token
        '404':
          description: User not found
        '500':
          description: Verification failed

  /api/auth/login:
    post:
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid email or password
        '403':
          description: Email has not been verified
        '422':
          description: Login validation failed

  /api/auth/refresh:
    post:
      summary: Refresh an access token
      description: Requires a valid refresh JWT in the Authorization header.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: New access token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/reset-password:
    post:
      summary: Reset a password using a recovery code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetInput'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Recovery code is invalid or expired
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '500':
          description: Password reset could not be completed

  /api/auth/resend-verification:
    post:
      summary: Resend an email verification link
      description: |
        Returns the same generic success message whether the email belongs
        to an unverified account, a verified account, or no account.
        Resends are subject to a 60-second cooldown.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationInput'
      responses:
        '200':
          description: Generic verification response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationValidationError'

  /api/auth/me:
    get:
      summary: Get the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/change-password:
    post:
      summary: Change the authenticated user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '200':
          description: Password updated
        '400':
          description: New password is too short
        '401':
          description: Old password is incorrect or token is invalid
        '404':
          description: User not found

  /api/campaigns/:
    get:
      summary: List campaigns
      description: |
        Public, paginated campaign listing. Filtering and sorting are applied
        before pagination. The status value completed is mapped to the stored
        status closed. Use all to disable status filtering.
      security: []
      parameters:
        - name: search
          in: query
          schema: { type: string }
          description: Case-insensitive search in campaign title and description.
        - name: status
          in: query
          schema:
            type: string
            example: active
          description: Filter by status. completed maps to closed; all disables filtering.
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, ending, goal-high, goal-low]
            default: newest
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated campaigns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignPage'
        '422':
          description: Invalid query parameter

    post:
      summary: Create a campaign
      description: Organizer only. Supports JSON or multipart form data. For multipart uploads, use the image field.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignInput'
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/CampaignInput'
                - type: object
                  properties:
                    image:
                      type: string
                      format: binary
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Invalid request body or campaign fields
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only organizers can create campaigns
        '502':
          description: Image upload failed

  /api/campaigns/{campaign_id}:
    parameters:
      - name: campaign_id
        in: path
        required: true
        schema: { type: integer }

    get:
      summary: Get campaign details
      security: []
      responses:
        '200':
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '404':
          description: Campaign not found

    patch:
      summary: Update a campaign
      description: Only the organizer who owns the campaign may update it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignUpdateInput'
      responses:
        '200':
          description: Campaign updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Empty body or invalid campaign fields
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Campaign belongs to another organizer
        '404':
          description: Campaign not found

    delete:
      summary: Delete a campaign
      description: Only the organizer who owns the campaign may delete it. Campaigns with pledge history cannot be deleted.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Campaign deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Campaign belongs to another organizer
        '404':
          description: Campaign not found
        '409':
          description: Campaign has pledge history and cannot be deleted

  /api/pledges/campaign/{campaign_id}:
    parameters:
      - name: campaign_id
        in: path
        required: true
        schema: { type: integer }

    get:
      summary: List public pledges for a campaign
      description: |
        Returns pending and confirmed pledges. Cancelled pledges are not public.
        The optional status filter accepts pending or confirmed.
      security: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated public pledges and raised amount
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPledgePage'
        '404':
          description: Campaign not found
        '422':
          description: Invalid query or cancelled pledges requested

    post:
      summary: Create a pledge for a campaign
      description: Authenticated contributors only. Campaign must be active.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PledgeCreateInput'
      responses:
        '201':
          description: Pledge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge: { $ref: '#/components/schemas/Pledge' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Only contributors can create pledges
        '404':
          description: Campaign not found
        '409':
          description: Campaign is closed
        '422':
          description: Invalid pledge fields

  /api/pledges/mine:
    get:
      summary: List the authenticated user's pledges
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated pledges belonging to the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PledgePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Invalid query parameters

  /api/pledges/campaign/{campaign_id}/manage:
    get:
      summary: Organizer pledge management view
      description: Organizer only. Returns pledges, status counts and confirmed raised amount for the selected campaign.
      security:
        - bearerAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema: { type: integer }
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, cancelled]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated campaign pledge management data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedPledgePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Organizer role required
        '404':
          description: Campaign not found
        '422':
          description: Invalid query parameters

  /api/pledges/{pledge_id}:
    parameters:
      - name: pledge_id
        in: path
        required: true
        schema: { type: integer }

    get:
      summary: Get a pledge
      description: Available to the contributor who owns the pledge or an organizer.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pledge details
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge: { $ref: '#/components/schemas/Pledge' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User cannot view this pledge
        '404':
          description: Pledge not found

    patch:
      summary: Update a pledge
      description: Only the contributor who owns a pending pledge may update it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PledgeUpdateInput'
      responses:
        '200':
          description: Pledge updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge: { $ref: '#/components/schemas/Pledge' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User does not own this pledge
        '404':
          description: Pledge not found
        '409':
          description: Pledge is not pending
        '422':
          description: Invalid pledge fields

    delete:
      summary: Cancel a pledge
      description: The pledge owner or an organizer may cancel a pending pledge.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pledge cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge: { $ref: '#/components/schemas/Pledge' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User cannot cancel this pledge
        '404':
          description: Pledge not found
        '409':
          description: Pledge is not pending

  /api/pledges/{pledge_id}/confirm:
    post:
      summary: Confirm a pledge
      description: Organizer only. Only pending pledges can be confirmed.
      security:
        - bearerAuth: []
      parameters:
        - name: pledge_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Pledge confirmed
          content:
            application/json:
              schema:
                type: object
                properties:
                  pledge: { $ref: '#/components/schemas/Pledge' }
                  campaign_id: { type: integer }
                  raised_amount: { type: number }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Organizer role required
        '404':
          description: Pledge not found
        '409':
          description: Pledge is not pending

  /api/pledges/{pledge_id}/remind:
    post:
      summary: Send a pledge reminder
      description: Organizer only. Sends a reminder email to the contributor associated with the pledge.
      security:
        - bearerAuth: []
      parameters:
        - name: pledge_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Reminder sent
        '400':
          description: Contributor email is unavailable
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Organizer role required or campaign unavailable
        '404':
          description: Pledge not found
        '502':
          description: Reminder email failed
        '503':
          description: Email or campaign service unavailable

  /api/admin/users:
    get:
      summary: List platform users
      description: Organizer only. Returns users in paginated order by user ID.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Organizer role required
        '422':
          description: Invalid pagination parameters

  /api/admin/dashboard:
    get:
      summary: Get platform dashboard statistics
      description: Organizer only. The /api/admin prefix does not represent a separate admin role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Platform statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Organizer role required

  /api/organizer/dashboard:
    get:
      summary: Get organizer dashboard statistics
      description: Returns statistics for the authenticated organizer's campaigns.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organizer dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizerDashboardStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Organizer role required

  /api/webhooks/sendgrid/events:
    post:
      summary: Receive SendGrid email delivery events
      description: |
        Accepts SendGrid event webhook payloads. Requests must include a
        valid ECDSA signature and timestamp. Events are stored idempotently
        using their SendGrid event IDs.
      security: []
      parameters:
        - name: X-Twilio-Email-Event-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
        - name: X-Twilio-Email-Event-Webhook-Timestamp
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/SendGridEvent'
      responses:
        '200':
          description: Events received and new events stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendGridEventsResponse'
        '400':
          description: Expected a JSON event array
        '401':
          description: Missing or invalid webhook signature
        '500':
          description: Could not save events
        '503':
          description: Webhook security is not configured

  /api/openapi.yaml:
    get:
      summary: Retrieve the OpenAPI specification
      security: []
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

  responses:
    Unauthorized:
      description: Missing, invalid or expired authentication token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties: true

    RegistrationInput:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 120
        password:
          type: string
          minLength: 8
        phone:
          type: string
          nullable: true
          maxLength: 20
        role:
          type: string
          enum: [organizer, contributor]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    ChangePasswordInput:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        role:
          type: string
          enum: [organizer, contributor]
        email_verified: { type: boolean }

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Access JWT used to authenticate API requests.
        refresh_token:
          type: string
          description: Refresh JWT used to obtain a new access token.
        user:
          $ref: '#/components/schemas/User'

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    ValidationError:
      type: object
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties: true

    RegistrationValidationError:
      type: object
      properties:
        errors:
          type: object
          additionalProperties: true

    PasswordResetInput:
      type: object
      required: [email, code, new_password]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128

    ResendVerificationInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 120

    OrganizerDashboardStats:
      type: object
      properties:
        total_campaigns:
          type: integer
        active_campaigns:
          type: integer
        total_contributions:
          type: integer
        total_amount_raised:
          type: number
          format: float

    SendGridEvent:
      type: object
      description: SendGrid email event webhook item.
      properties:
        sg_event_id:
          type: string
        email:
          type: string
          format: email
        event:
          type: string
        timestamp:
          oneOf:
            - type: integer
            - type: number
            - type: string
        sg_message_id:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
        response:
          type: string
          nullable: true

    SendGridEventsResponse:
      type: object
      properties:
        message:
          type: string
        received:
          type: integer
        stored:
          type: integer

    CampaignInput:
      type: object
      required: [title, description, goal_amount]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        description:
          type: string
          minLength: 10
        goal_amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
        end_date:
          type: string
          format: date-time
          nullable: true

    CampaignUpdateInput:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 150
        description:
          type: string
          minLength: 10
        goal_amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          multipleOf: 0.01
        end_date:
          type: string
          format: date-time
          nullable: true

    Campaign:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        goal_amount:
          type: string
          description: Decimal amount serialized as a string by the campaign schema.
        image_url:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, closed]
        end_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        organizer_id: { type: integer }

    CampaignPage:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        pages: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'

    PledgeCreateInput:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          minimum: 1
          maximum: 10000000
          multipleOf: 0.01
        message:
          type: string
          nullable: true
          maxLength: 500

    PledgeUpdateInput:
      type: object
      minProperties: 1
      properties:
        amount:
          type: number
          minimum: 1
          maximum: 10000000
          multipleOf: 0.01
        message:
          type: string
          nullable: true
          maxLength: 500

    Pledge:
      type: object
      properties:
        id: { type: integer }
        campaign_id: { type: integer }
        amount: { type: number, nullable: true }
        message: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, confirmed, cancelled]
        created_at:
          type: string
          format: date-time
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        contributor:
          type: object
          nullable: true
          properties:
            id: { type: integer, nullable: true }
            name: { type: string, nullable: true }

    PledgePage:
      type: object
      properties:
        count: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
